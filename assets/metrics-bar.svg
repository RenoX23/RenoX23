<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 115" width="100%" height="115" role="img" aria-label="Production Vitals and SLA Benchmarks">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E121A" />
      <stop offset="100%" stop-color="#08090C" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .metric-box { transition: all 0.3s ease; }
    .glow-teal { fill: #2DE2C4; }
    .glow-blue { fill: #5AA9FF; }
    .glow-purple { fill: #A78BFA; }
    .glow-mint { fill: #00F5D4; }
  </style>

  <!-- Container -->
  <rect width="900" height="115" rx="12" fill="#08090C" />
  <rect x="0.75" y="0.75" width="898.5" height="113.5" rx="11.25" fill="none" stroke="#1B2130" stroke-width="1.5" />

  <!-- Metric 1: 19.1ms P99 SLA -->
  <g transform="translate(14, 12)">
    <rect width="206" height="91" rx="8" fill="url(#cardGrad)" stroke="#1B2130" stroke-width="1" />
    <line x1="0" y1="0" x2="3" y2="91" stroke="#2DE2C4" stroke-width="3" />
    <text x="18" y="36" class="mono glow-teal" font-size="24" font-weight="700" letter-spacing="-0.5">19.1ms</text>
    <text x="18" y="56" class="mono" font-size="10" font-weight="700" fill="#EDF0F7" letter-spacing="1.2">P99 INFERENCE SLA</text>
    <text x="18" y="74" class="mono" font-size="9.5" fill="#6E7D91">Payment Fraud Pipeline</text>
  </g>

  <!-- Metric 2: 96.6% RAG Faithfulness -->
  <g transform="translate(234, 12)">
    <rect width="206" height="91" rx="8" fill="url(#cardGrad)" stroke="#1B2130" stroke-width="1" />
    <line x1="0" y1="0" x2="3" y2="91" stroke="#5AA9FF" stroke-width="3" />
    <text x="18" y="36" class="mono glow-blue" font-size="24" font-weight="700" letter-spacing="-0.5">96.6%</text>
    <text x="18" y="56" class="mono" font-size="10" font-weight="700" fill="#EDF0F7" letter-spacing="1.2">RAGAS FAITHFULNESS</text>
    <text x="18" y="74" class="mono" font-size="9.5" fill="#6E7D91">RBI/SEBI Regulatory RAG</text>
  </g>

  <!-- Metric 3: 1.14ms Redis ZSET -->
  <g transform="translate(454, 12)">
    <rect width="206" height="91" rx="8" fill="url(#cardGrad)" stroke="#1B2130" stroke-width="1" />
    <line x1="0" y1="0" x2="3" y2="91" stroke="#A78BFA" stroke-width="3" />
    <text x="18" y="36" class="mono glow-purple" font-size="24" font-weight="700" letter-spacing="-0.5">1.14ms</text>
    <text x="18" y="56" class="mono" font-size="10" font-weight="700" fill="#EDF0F7" letter-spacing="1.2">REDIS FEATURE STORE</text>
    <text x="18" y="74" class="mono" font-size="9.5" fill="#6E7D91">Pipelined ZSET Velocity</text>
  </g>

  <!-- Metric 4: 0.992 PR-AUC -->
  <g transform="translate(674, 12)">
    <rect width="212" height="91" rx="8" fill="url(#cardGrad)" stroke="#1B2130" stroke-width="1" />
    <line x1="0" y1="0" x2="3" y2="91" stroke="#00F5D4" stroke-width="3" />
    <text x="18" y="36" class="mono glow-mint" font-size="24" font-weight="700" letter-spacing="-0.5">0.992</text>
    <text x="18" y="56" class="mono" font-size="10" font-weight="700" fill="#EDF0F7" letter-spacing="1.2">PR-AUC SCORE</text>
    <text x="18" y="74" class="mono" font-size="9.5" fill="#6E7D91">0.20% Imbalanced Stream</text>
  </g>
</svg>
