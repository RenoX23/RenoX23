  <text x="24" y="32" class="mono" font-size="10.5" font-weight="600" fill="#7C8699" letter-spacing="1">SYSTEM // 02</text>
  <rect x="306" y="20" width="114" height="20" rx="10" fill="#132035" stroke="#1D3459" stroke-width="1" />
  <text x="363" y="33.5" class="mono" font-size="9" font-weight="700" fill="#5AA9FF" text-anchor="middle" letter-spacing="1">LOW-LATENCY ML</text>

