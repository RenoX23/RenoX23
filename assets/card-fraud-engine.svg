  </style>

  <!-- Container -->
  <rect width="440" height="225" rx="12" fill="url(#cardBg2)" />
  <rect x="0.75" y="0.75" width="438.5" height="223.5" rx="11.25" fill="none" stroke="#1B2130" stroke-width="1.5" />

  <!-- Left Spine Accent -->
  <rect x="0" y="16" width="3.5" height="193" rx="1.75" fill="#5AA9FF" />

