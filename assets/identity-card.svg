<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="320" role="img" aria-label="Identity and Engineering Manifesto — Renold Stephen R">
  <defs>
    <linearGradient id="idBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090C" />
      <stop offset="100%" stop-color="#0C0F17" />
    </linearGradient>
    <linearGradient id="accentTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DE2C4" />
      <stop offset="100%" stop-color="#5AA9FF" />
    </linearGradient>
    <pattern id="idDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1A2333" opacity="0.5"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .pulse { animation: pulseAnim 2.2s infinite ease-in-out; }
    @keyframes pulseAnim { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  </style>

  <!-- Background Frame -->
  <rect width="900" height="320" rx="14" fill="url(#idBg)" />
  <rect width="900" height="320" rx="14" fill="url(#idDots)" />
  <rect x="0.75" y="0.75" width="898.5" height="318.5" rx="13.25" fill="none" stroke="#1B2130" stroke-width="1.5" />

  <!-- Vertical Divider Line -->
  <line x1="570" y1="20" x2="570" y2="300" stroke="#1B2130" stroke-width="1" />

  <!-- LEFT COLUMN: Engineering Manifesto -->
  <g transform="translate(36, 32)">
    <!-- Chapter Tag -->
    <text x="0" y="0" class="mono" font-size="11" font-weight="600" fill="#2DE2C4" letter-spacing="1.5">// 01 · IDENTITY &amp; MANIFESTO</text>

    <!-- Title -->
    <text x="0" y="32" class="mono" font-size="22" font-weight="700" fill="#EDF0F7" letter-spacing="-0.5">
      AI Systems &amp; Intelligence Engineer
    </text>
    <text x="0" y="54" class="mono" font-size="12" font-weight="600" fill="#7C8699" letter-spacing="0.5">
      DATA ANALYST AT HEART · SYSTEMS BUILDER BY PRACTICE
    </text>

    <!-- Narrative Paragraph -->
    <text x="0" y="86" class="mono" font-size="12" fill="#9BA8BA">I architect and ship production AI systems where reliability,</text>
    <text x="0" y="104" class="mono" font-size="12" fill="#9BA8BA">sub-20ms latency, and strict verification guardrails matter.</text>
    <text x="0" y="126" class="mono" font-size="12" fill="#9BA8BA">Having a Data Analyst's DNA means I don't treat models as black</text>
    <text x="0" y="144" class="mono" font-size="12" fill="#9BA8BA">boxes: I inspect distributions, model schemas, track unit</text>
    <text x="0" y="162" class="mono" font-size="12" fill="#9BA8BA">economics, and ground every agent in verifiable data telemetry.</text>

    <!-- Core Pillars Pills -->
    <g transform="translate(0, 184)">
      <rect x="0" y="0" width="128" height="22" rx="11" fill="#11221E" stroke="#1C3D35" stroke-width="1"/>
      <text x="64" y="14.5" class="mono" font-size="9.5" font-weight="600" fill="#2DE2C4" text-anchor="middle">Agentic AI &amp; RAG</text>

      <rect x="136" y="0" width="138" height="22" rx="11" fill="#132035" stroke="#1D3459" stroke-width="1"/>
      <text x="205" y="14.5" class="mono" font-size="9.5" font-weight="600" fill="#5AA9FF" text-anchor="middle">Low-Latency ML</text>

      <rect x="282" y="0" width="120" height="22" rx="11" fill="#1C172E" stroke="#332454" stroke-width="1"/>
      <text x="342" y="14.5" class="mono" font-size="9.5" font-weight="600" fill="#A78BFA" text-anchor="middle">Production MLOps</text>

      <rect x="410" y="0" width="104" height="22" rx="11" fill="#101F1D" stroke="#1A3E39" stroke-width="1"/>
      <text x="462" y="14.5" class="mono" font-size="9.5" font-weight="600" fill="#00F5D4" text-anchor="middle">Data Analytics</text>
    </g>

    <!-- Core Principle Quote -->
    <g transform="translate(0, 222)">
      <rect x="0" y="0" width="514" height="38" rx="6" fill="#07090E" stroke="#172233" stroke-width="1" />
      <text x="14" y="24" class="mono" font-size="11" fill="#7C8699">
        <tspan fill="#2DE2C4">&gt;</tspan> Build beyond notebooks: containerized, observable, and SLA-bound.
      </text>
    </g>
  </g>

  <!-- RIGHT COLUMN: System Spec Sheet -->
  <g transform="translate(600, 32)">
    <text x="0" y="0" class="mono" font-size="11" font-weight="700" fill="#7C8699" letter-spacing="2">SYSTEM SPEC</text>
    <line x1="0" y1="12" x2="260" y2="12" stroke="#1B2130" stroke-width="1" />

    <text x="0" y="38" class="mono" font-size="10" font-weight="600" fill="#58677D" letter-spacing="1.2">ROLE</text>
    <text x="80" y="38" class="mono" font-size="11.5" font-weight="600" fill="#EDF0F7">AI Systems Engineer</text>

    <text x="0" y="64" class="mono" font-size="10" font-weight="600" fill="#58677D" letter-spacing="1.2">BASE</text>
    <text x="80" y="64" class="mono" font-size="11.5" fill="#EDF0F7">Bengaluru, IN</text>

    <text x="0" y="90" class="mono" font-size="10" font-weight="600" fill="#58677D" letter-spacing="1.2">COORDS</text>
    <text x="80" y="90" class="mono" font-size="11.5" fill="#7C8699">12.97° N, 77.59° E</text>

    <text x="0" y="116" class="mono" font-size="10" font-weight="600" fill="#58677D" letter-spacing="1.2">DEGREE</text>
    <text x="80" y="116" class="mono" font-size="11.5" fill="#EDF0F7">M.Tech CS <tspan fill="#2DE2C4">(3.67/4.0)</tspan></text>

    <text x="0" y="142" class="mono" font-size="10" font-weight="600" fill="#58677D" letter-spacing="1.2">SCHOOL</text>
    <text x="80" y="142" class="mono" font-size="11.5" fill="#EDF0F7">Christ University</text>

    <line x1="0" y1="162" x2="260" y2="162" stroke="#1B2130" stroke-width="1" />

    <text x="0" y="186" class="mono" font-size="11" font-weight="700" fill="#7C8699" letter-spacing="2">AVAILABILITY</text>
    <g transform="translate(0, 198)">
      <rect x="0" y="0" width="260" height="26" rx="6" fill="#11221E" stroke="#1C3D35" stroke-width="1" />
      <circle cx="16" cy="13" r="3.5" fill="#2DE2C4" class="pulse"/>
      <text x="28" y="17" class="mono" font-size="10.5" font-weight="600" fill="#2DE2C4" letter-spacing="0.8">OPEN TO WORK · Startups</text>
    </g>

    <g transform="translate(0, 236)">
      <text x="0" y="0" class="mono" font-size="9.5" fill="#58677D" letter-spacing="0.5">CORE BENCHMARKS</text>
      <text x="0" y="18" class="mono" font-size="10.5" fill="#2DE2C4">19.1ms P99 <tspan fill="#58677D">·</tspan> 96.6% RAG <tspan fill="#58677D">·</tspan> 0.992 AUC</text>
    </g>
  </g>
</svg>
